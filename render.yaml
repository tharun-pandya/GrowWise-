# Render Blueprint: GrowWise - Grounded AI-Powered Garden Planner
# Single Unified Web Service: React + TypeScript + Vite frontend served via FastAPI backend
# One service, one build, one public domain.
services:
  - type: web
    name: growwise
    rootDir: .
    env: python
    plan: free
    region: oregon
    buildCommand: ./build.sh
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: AI_PROVIDER_TYPE
        value: offline  # Default zero-RAM offline synthesizer; or 'open_weight' when configured
      - key: CORS_ORIGINS
        value: "*"
      - key: OPEN_WEIGHT_ENDPOINT_URL
        sync: false     # Optional: Set to e.g. https://api.together.xyz/v1/chat/completions or private vLLM service
      - key: OPEN_WEIGHT_MODEL_NAME
        value: google/gemma-2-2b-it
      - key: OPEN_WEIGHT_API_KEY
        sync: false
